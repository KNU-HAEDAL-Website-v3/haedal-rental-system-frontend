name: ✨ 기능 개발
description: 새로운 기능을 직접 개발합니다
title: "feat: "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        제목의 `feat: ` 뒤에 **무엇을 만드는지** 이어서 적어주세요.

        이 이슈에서 파생되는 이름은 아래 규칙을 따릅니다.
        - 이슈 제목 → `feat: 로그인 화면 추가`
        - 브랜치 → `feat/23-login` (이슈 번호 포함, 영문 소문자·하이픈, 30자 이내)
        - 커밋 → `feat(auth): add login screen` (영어, 50자 이내, 마침표 없음)
        - PR 제목 → `[feat] #23 로그인 화면 추가`

        자세한 규칙은 `docs/project-rules/branch-strategy.md` 를 참고해주세요.

  - type: textarea
    id: summary
    attributes:
      label: 개발할 기능
      description: 무엇을 만드는지 한두 문장으로 적어주세요
      placeholder: 라벨을 스캔해서 도서를 대여하는 화면을 만듭니다
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: 관련 요구사항 ID
      description: docs/planning/requirements-definition.md 기준. 해당 없으면 비워두세요
      placeholder: FR-RNT-001
    validations:
      required: false

  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 체크박스로 쪼개두면 작업하면서 하나씩 체크할 수 있습니다
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: ref
    attributes:
      label: 참고 자료
      description: 디자인 시안, 문서 링크, 관련 이슈 번호(#12) 등
    validations:
      required: false

  - type: input
    id: due
    attributes:
      label: 예상 완료일
      placeholder: 2026-08-23
    validations:
      required: false
